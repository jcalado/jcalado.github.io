<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="'DejaVu Sans Mono', Consolas, monospace">
  <defs>
    <style>
      .wire   { stroke:#009900; stroke-width:2; fill:none; }
      .comp   { stroke:#8b0000; stroke-width:2; fill:none; }
      .fill   { stroke:#8b0000; stroke-width:2; fill:#ffffc2; }
      .lbl    { stroke:#8b0000; stroke-width:1.5; fill:#fff; }
      .txt    { fill:#8b0000; font-size:13px; }
      .val    { fill:#008080; font-size:13px; }
      .pin    { fill:#8b0000; font-size:12px; }
      .title  { fill:#8b0000; font-size:20px; font-style:italic; font-weight:bold; }
      .sec    { fill:#0000cc; font-size:16px; font-weight:bold; }
      .box    { stroke:#0000cc; stroke-width:1.5; stroke-dasharray:6 4; fill:none; }
      .junc   { fill:#009900; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="420" fill="#fbfbf6"/>

  <!-- section boxes -->
  <rect x="20" y="20" width="310" height="320" class="box"/>
  <rect x="330" y="20" width="270" height="320" class="box"/>
  <rect x="600" y="20" width="280" height="320" class="box"/>
  <text x="30" y="332" class="sec">RJ45 (GM950)</text>
  <text x="340" y="332" class="sec">TX / RX</text>
  <text x="610" y="332" class="sec">TTL MODULE</text>

  <!-- ===== RJ45 female connector ===== -->
  <text x="150" y="50" class="val" text-anchor="middle">J2</text>
  <text x="150" y="68" class="val" text-anchor="middle">RJ45 Female (GM950)</text>
  <rect x="80" y="85" width="120" height="215" class="fill"/>
  <!-- jack graphic (side view: contacts stacked vertically, aligned with pins 8..1) -->
  <path d="M105 100 h60 v68 h20 v10 h10 v40 h-10 v10 h-20 v62 h-60 z" class="comp" fill="#fff"/>
  <path d="M108 110 h16 M108 135 h16 M108 160 h16 M108 185 h16 M108 210 h16 M108 235 h16 M108 260 h16 M108 285 h16" class="comp" stroke-width="1.5"/>
  <!-- pins 8..1 top to bottom -->
  <g class="pin">
    <line x1="200" y1="110" x2="220" y2="110" class="comp"/><text x="208" y="105">8</text>
    <line x1="200" y1="135" x2="220" y2="135" class="comp"/><text x="208" y="130">7</text>
    <line x1="200" y1="160" x2="220" y2="160" class="comp"/><text x="208" y="155">6</text>
    <line x1="200" y1="185" x2="220" y2="185" class="comp"/><text x="208" y="180">5</text>
    <line x1="200" y1="210" x2="220" y2="210" class="comp"/><text x="208" y="205">4</text>
    <line x1="200" y1="235" x2="220" y2="235" class="comp"/><text x="208" y="230">3</text>
    <line x1="200" y1="260" x2="220" y2="260" class="comp"/><text x="208" y="255">2</text>
    <line x1="200" y1="285" x2="220" y2="285" class="comp"/><text x="208" y="280">1</text>
  </g>
  <!-- NC labels -->
  <g class="pin">
    <text x="228" y="139">NC</text>
    <text x="228" y="214">NC</text>
    <text x="228" y="239">NC</text>
    <text x="228" y="289">NC</text>
  </g>

  <!-- ===== Bridge: pin 6 -> 1k -> pin 8 ===== -->
  <line x1="220" y1="110" x2="290" y2="110" class="wire"/>
  <line x1="220" y1="160" x2="290" y2="160" class="wire"/>
  <line x1="290" y1="110" x2="290" y2="118" class="wire"/>
  <line x1="290" y1="152" x2="290" y2="160" class="wire"/>
  <rect x="283" y="118" width="14" height="34" class="comp"/>
  <text x="302" y="130" class="txt">R1</text>
  <text x="302" y="145" class="val">1K</text>

  <!-- ===== GND: pin 5 -> GND ===== -->
  <line x1="220" y1="185" x2="700" y2="185" class="wire"/>
  <text x="228" y="180" class="pin">GND</text>

  <!-- ===== Data: pin 2 -> RXD, pin 2 -> diode -> TXD ===== -->
  <line x1="220" y1="260" x2="700" y2="260" class="wire"/>
  <circle cx="400" cy="260" r="4" class="junc"/>
  <line x1="400" y1="260" x2="400" y2="225" class="wire"/>
  <line x1="400" y1="225" x2="450" y2="225" class="wire"/>
  <!-- diode: anode at radio side, cathode toward TXD -->
  <polygon points="450,215 450,235 470,225" class="comp" fill="#fbfbf6"/>
  <line x1="470" y1="215" x2="470" y2="235" class="comp"/>
  <line x1="470" y1="225" x2="700" y2="225" class="wire"/>
  <text x="440" y="208" class="txt">D1</text>
  <text x="464" y="208" class="val">1N4148</text>
  <text x="228" y="255" class="pin">DATA</text>

  <!-- ===== TTL module (PL2303 / CP2102 / FTDI) ===== -->
  <text x="740" y="60" class="val" text-anchor="middle">J1 - USB to TTL module</text>
  <text x="740" y="78" class="val" text-anchor="middle">(PL2303 / CP2102 / FTDI)</text>
  <text x="740" y="94" class="val" text-anchor="middle" font-size="11">pin order varies - wire by function</text>
  <rect x="770" y="100" width="30" height="215" class="fill"/>
  <g class="pin">
    <rect x="700" y="106" width="70" height="18" class="lbl"/><text x="735" y="119" text-anchor="middle">3V3</text>
    <rect x="700" y="141" width="70" height="18" class="lbl"/><text x="735" y="154" text-anchor="middle">5V</text>
    <rect x="700" y="176" width="70" height="18" class="lbl"/><text x="735" y="189" text-anchor="middle">GND</text>
    <rect x="700" y="216" width="70" height="18" class="lbl"/><text x="735" y="229" text-anchor="middle">TXD</text>
    <rect x="700" y="251" width="70" height="18" class="lbl"/><text x="735" y="264" text-anchor="middle">RXD</text>
    <rect x="700" y="286" width="70" height="18" class="lbl"/><text x="735" y="299" text-anchor="middle">DTR</text>
    <text x="808" y="119">1  NC</text>
    <text x="808" y="154">2  NC</text>
    <text x="808" y="189">3</text>
    <text x="808" y="229">4</text>
    <text x="808" y="264">5</text>
    <text x="808" y="299">6  NC</text>
    <line x1="770" y1="115" x2="785" y2="115" class="comp"/>
    <line x1="770" y1="150" x2="785" y2="150" class="comp"/>
    <line x1="770" y1="185" x2="785" y2="185" class="comp"/>
    <line x1="770" y1="225" x2="785" y2="225" class="comp"/>
    <line x1="770" y1="260" x2="785" y2="260" class="comp"/>
    <line x1="770" y1="295" x2="785" y2="295" class="comp"/>
  </g>

  <!-- ===== Title block ===== -->
  <line x1="20" y1="355" x2="880" y2="355" class="comp" stroke-width="1"/>
  <text x="30" y="380" class="title">Motorola GM950 Programming Cable</text>
  <text x="30" y="400" class="txt">RJ45 pin 2 → RXD · pin 2 → D1 → TXD · pin 5 → GND · pin 6 → 1K → pin 8</text>
  <text x="870" y="400" class="txt" text-anchor="end">CT7BLE (Thanks CR7BPM)</text>
</svg>
